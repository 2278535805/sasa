[package]
name = "sasa"
version = "0.2.0"
edition = "2021"

[features]
default = ["cpal"]
cpal = ["dep:cpal"]
oboe = ["dep:oboe"]
ohos = ["dep:ohos-audio-sys"]
wasapi = ["dep:wasapi"]

[dependencies]
anyhow = "1.0.68"
cpal = { version = "0.16.0", optional = true }
parking_lot = "0.12.5"
ringbuf = "0.3.3"
symphonia = { version = "0.5.2", features = ["mp3", "aac"] }
thiserror = "2.0.16"

oboe = { git = "https://github.com/2278535805/oboe-rs", optional = true, features = ["shared-stdcxx"] }
ohos-audio-sys = { version = "0.0.1", optional = true, features = ["api-20"] }
wasapi = { version = "0.23.0", optional = true }
atomic_float = "1.1.0"

[dev-dependencies]
kira = "0.7.1"
